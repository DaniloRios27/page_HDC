<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0c2b4d">
  <title>Baja registrada | HDC Gestión Biomédica</title>
  <meta name="description" content="Tu solicitud de baja de las comunicaciones de HDC Gestión Biomédica quedó registrada.">
  <link rel="icon" href="assets/logo/hdc-dark.svg" type="image/svg+xml">

  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("assets/fonts/Satoshi-Variable.woff2") format("woff2");
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --navy: #0c2b4d;
      --teal: #0191b3;
      --cyan: #3abfde;
      --ground: #f4fafc;
      --muted: #526b7d;
      --line: #cfe2ea;
      --font-body: "Satoshi", "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(58, 191, 222, 0.18), transparent 32rem),
        var(--ground);
      color: var(--navy);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 2.5rem, 620px);
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    .brand { display: inline-block; margin-bottom: 2rem; }
    .brand img { display: block; width: 190px; height: auto; }

    .card {
      padding: clamp(1.5rem, 5vw, 2.75rem);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(12, 43, 77, 0.09);
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--teal);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    p { margin: 0 0 1rem; color: #294761; font-size: 0.98rem; }

    .muted { color: var(--muted); font-size: 0.85rem; }

    .check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-bottom: 1rem;
      border-radius: 50%;
      background: #e6f5fc;
      color: var(--teal);
      font-size: 1.3rem;
      font-weight: 800;
    }

    .back {
      display: inline-block;
      margin-top: 0.5rem;
      color: var(--teal);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    .foot {
      margin: 2rem 0 0;
      color: #71889a;
      font-size: 0.72rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="index.html" aria-label="HDC Gestión Biomédica, inicio">
      <img src="assets/logo/hdc-dark.svg" alt="HDC by Grupo Gess" width="730" height="341">
    </a>

    <section class="card" aria-labelledby="titulo-baja">
      <div class="check" aria-hidden="true">✓</div>
      <p class="eyebrow">COMUNICACIONES HDC</p>
      <h1 id="titulo-baja">Baja registrada</h1>

      <p>No volverás a recibir correos comerciales de HDC Gestión Biomédica en esta dirección.</p>
      <p class="muted">Si recibes otro mensaje, responde a ese correo para avisarnos.</p>

      <a class="back" href="index.html">Volver al sitio</a>
    </section>

    <p class="foot">HDC Gestión Biomédica · HDC by Grupo Gess · Arauca · Casanare · Boyacá</p>
  </main>
</body>
</html>
